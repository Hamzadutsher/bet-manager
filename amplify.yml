version: 1
frontend:
  phases:
    preBuild:
      commands:
        # Amplify exige Node.js 20+ pour le rendu serveur (SSR / Web Compute)
        - nvm install 20
        - nvm use 20
        - node -v
        # Vérifie que la variable de base de données est bien définie (sinon build échoue avec un message clair)
        - 'if [ -z "$DATABASE_URL" ]; then echo "ERREUR: la variable DATABASE_URL n''est pas définie dans Amplify (App settings > Environment variables)."; exit 1; fi'
        # Installe les dépendances
        - npm install
        # Rend DATABASE_URL disponible au runtime Lambda (SSR) via un fichier .env
        # embarqué dans l'artefact de build. La variable est définie dans la console Amplify.
        - echo "DATABASE_URL=$DATABASE_URL" >> .env
    build:
      commands:
        # Génère le client Prisma (avec les binaires Lambda)
        - npx prisma generate
        # Crée / synchronise les tables dans PostgreSQL
        - npx prisma db push
        # Remplit la base la 1re fois (non destructif ensuite)
        - node prisma/seed-if-empty.js
        # Build Next.js
        - npm run build
  artifacts:
    # Application Next.js SSR : Amplify prend le dossier .next
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - .next/cache/**/*
